<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta property="og:description" content="Kevin Ribeiro, governança de TI e IA em Fortaleza. Estruturo como a IA entra nos processos de uma empresa, com regra, dono e métrica.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: planta técnica em navy. Nav flutuante, hero com a interface do agente, faixas de seção em grade de 40px, tudo em Geist com cantos retos. */
:root{
  --bg:#0B1730; --surface:#13254D; --surface-2:#0F1E3F; --fg:#FFFFFF; --muted:#AFC1DD; --line:#26385F;
  --accent:#FFB020; --accent-fg:#0B1730; --accent-text:#FFB020; --action:#1F4FE0; --action-fg:#FFFFFF; --link:#8EA8F5;
  --hero-a:#FFFFFF; --hero-b:#9B9B9B; --grid:rgba(124,156,203,.10); --nav:rgba(11,23,48,.72);
  --ok:#8EA8F5; --warn:#FFB020; --dev:#FF8A5C;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(0.22,1,0.36,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4F4F0; --surface:#FFFFFF; --surface-2:#E3E7EE; --fg:#0E1117; --muted:#5A6272; --line:#DADDE3;
  --accent:#FFB020; --accent-fg:#0B1730; --accent-text:#7A4E00; --action:#1F4FE0; --action-fg:#FFFFFF; --link:#1F4FE0;
  --hero-a:#000000; --hero-b:#666666; --grid:rgba(31,79,224,.07); --nav:rgba(244,244,240,.78);
  --ok:#1F4FE0; --warn:#7A4E00; --dev:#C2410C; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F4F4F0; --surface:#FFFFFF; --surface-2:#E3E7EE; --fg:#0E1117; --muted:#5A6272; --line:#DADDE3;
  --accent:#FFB020; --accent-fg:#0B1730; --accent-text:#7A4E00; --action:#1F4FE0; --action-fg:#FFFFFF; --link:#1F4FE0;
  --hero-a:#000000; --hero-b:#666666; --grid:rgba(31,79,224,.07); --nav:rgba(244,244,240,.78);
  --ok:#1F4FE0; --warn:#7A4E00; --dev:#C2410C; color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.ic{width:20px;height:20px;flex:none}

/* text styles (landing-page-design B1) */
.heading-1{font-size:60px;line-height:60px;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
.heading-2{font-size:48px;line-height:48px;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
.heading-3{font-size:36px;line-height:40px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.heading-5{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.heading-6{font-size:20px;line-height:28px;font-weight:600;text-wrap:balance}
.title-2{font-size:18px;line-height:28px;font-weight:500}
.title-3{font-size:16px;line-height:24px;font-weight:500}
.title-4{font-size:14px;line-height:20px;font-weight:500}
.body-2{font-size:16px;line-height:24px;font-weight:500;text-wrap:pretty}
.body-3{font-size:16px;line-height:24px;font-weight:400;text-wrap:pretty}
.body-6{font-size:14px;line-height:20px;font-weight:400;text-wrap:pretty}
.title-1{font-size:20px;line-height:28px;font-weight:500;text-wrap:pretty}
.button-lg{font-size:18px;line-height:28px;font-weight:600}
.button-sm{font-size:14px;line-height:20px;font-weight:600}
.caption-3{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.caption-4{font-size:12px;line-height:16px;font-weight:500}
.caption-5{font-size:12px;line-height:16px;font-weight:400}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grid-bg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}

.skip{position:absolute;left:16px;top:-64px;z-index:30;background:var(--accent);color:var(--accent-fg);padding:8px 12px;text-decoration:none}
.skip:focus{top:calc(16px + env(safe-area-inset-top,0px))}

/* buttons (B2: 8px x 12px) */
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:var(--font);transition:transform 300ms var(--ease),background-color 300ms var(--ease),opacity 300ms var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:#FFC24D}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface)}
.btn-dark{background:var(--action);color:var(--action-fg)}
.btn-dark:hover{background:#3A66EC}

/* nav (B7 navigation) */
.nav{position:fixed;z-index:20;left:0;right:0;top:calc(16px + env(safe-area-inset-top,0px));display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.nav-bar{pointer-events:auto;display:flex;align-items:center;gap:24px;padding:8px 8px 8px 16px;background:var(--nav);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none}
.brand svg{width:24px;height:24px}
.links{display:flex;gap:4px}
.links a{display:inline-block;padding:8px 12px;color:var(--muted);text-decoration:none;transition:color 300ms var(--ease)}
.links a:hover,.links a[aria-current="true"]{color:var(--fg)}
.links a[aria-current="true"]{box-shadow:inset 0 -2px 0 var(--accent)}
.menu-btn{display:none;width:44px;height:44px;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);color:var(--fg);cursor:pointer;position:relative}
.menu-btn i{position:absolute;left:12px;right:12px;height:2px;background:currentColor;transition:transform 500ms var(--ease)}
.menu-btn i:first-child{transform:translateY(-4px)}
.menu-btn i:last-child{transform:translateY(4px)}
.menu-btn[aria-expanded="true"] i:first-child{transform:rotate(45deg)}
.menu-btn[aria-expanded="true"] i:last-child{transform:rotate(-45deg)}
.panel{position:fixed;inset:0;z-index:19;background:var(--nav);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);padding:calc(96px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.panel a{color:var(--fg);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line)}
.panel .btn{margin-top:24px;align-self:flex-start;border-bottom:1px solid transparent;padding:8px 12px}
.panel.open a{animation:linkIn 500ms var(--ease) both}

/* hero */
.hero{padding-top:calc(160px + env(safe-area-inset-top,0px));padding-bottom:96px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:64px;align-items:center}
.hero-copy{display:flex;flex-direction:column;gap:24px;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--accent-text)}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--accent)}
.hero h1{max-width:680px;background:linear-gradient(90deg,var(--hero-a),var(--hero-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{max-width:680px;color:var(--muted)}
.proof{display:flex;flex-wrap:wrap;gap:8px 24px;padding-top:8px}
.proof li{display:flex;align-items:center;gap:8px;color:var(--muted)}
.proof b{color:var(--fg);font-weight:600}
.proof .ic{color:var(--accent-text)}

.agent{background:var(--surface);border:1px solid var(--line);min-width:0}
.agent-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);margin:-1px -1px 0;background:var(--surface-2)}
.agent-id{display:flex;align-items:center;gap:12px}
.agent-av{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid var(--link)}
.agent-av svg{width:18px;height:18px}
.agent-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.ask{align-self:flex-end;background:var(--surface-2);padding:8px 12px;max-width:85%}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--fg)}
.tbl td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.flag td{color:var(--accent-text)}
.seal{display:inline-block;padding:2px 8px;font-family:var(--mono)}
.seal-fato{background:var(--action);color:var(--action-fg)}
.seal-inf{border:1px dashed var(--muted);color:var(--muted)}
.agent-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}

/* sections */
section{padding-block:96px;border-bottom:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 64px;align-items:end;margin-bottom:48px}
.sec-head .caption-3{grid-column:1/-1;color:var(--accent-text)}
.sec-head h2{max-width:680px}
.sec-head p{color:var(--muted);max-width:560px}

.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);padding:32px;display:flex;flex-direction:column;gap:16px}
.box li{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-bottom:1px solid var(--line)}
.box li:last-child{border-bottom:0}
.box li .ic{margin-top:2px}
.box.before .ic{color:var(--dev)}
.box.after{border-color:var(--link)}
.box.after .ic{color:var(--link)}

.benefits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.benefit{background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:12px;transition:transform 500ms var(--ease),border-color 300ms var(--ease)}
.benefit:hover{transform:translateY(-4px);border-color:var(--link)}
.benefit .ic{width:32px;height:32px;color:var(--link)}

.tagline{padding-block:96px}
.tagline p{max-width:880px}
.tagline .w{opacity:.3;transition:opacity 500ms var(--ease)}
.tagline .w.on{opacity:1}
.tagline .w.hl.on{color:var(--accent-text)}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:s}
.step{border:1px solid var(--line);padding:32px;display:flex;flex-direction:column;gap:16px;background:var(--surface-2)}
.step-n{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:2px solid var(--fg);font-family:var(--mono);font-weight:500}
.step:nth-child(2) .step-n{background:var(--action);border-color:var(--action);color:var(--action-fg)}
.step:nth-child(3) .step-n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.case{background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:16px}
.case dl{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.case dt{color:var(--muted)}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line)}
.chip::before{content:"";width:8px;height:8px}
.chip.prod::before{background:var(--accent)}
.chip.ent::before{background:var(--link)}
.chip.rec::before{background:var(--muted)}
.case.wide{grid-column:span 2;background:var(--action);border-color:var(--action);color:var(--action-fg)}
.case.wide .muted,.case.wide dt{color:#DCE6FF}
.case.wide dl{border-color:rgba(255,255,255,.3)}
.case.wide .chip{border-color:rgba(255,255,255,.4)}

.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.num{border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:8px}
.num b{font-size:48px;line-height:48px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--fg)}
.tl li{padding:16px 12px 0 0;display:flex;flex-direction:column;gap:4px}
.tl li.now{box-shadow:inset 0 3px 0 var(--accent)}
.creds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:48px}
.cred{border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:12px}
.cred li{padding-block:8px;border-bottom:1px solid var(--line)}
.cred li:last-child{border-bottom:0}

.faq{max-width:880px;border-top:1px solid var(--fg)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:24px;align-items:center;padding-block:24px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{transition:transform 500ms var(--ease);color:var(--link)}
.faq details[open] summary .ic{transform:rotate(45deg)}
.faq .ans{padding-bottom:24px;color:var(--muted);max-width:680px}

.final{text-align:left}
.final-box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:48px;align-items:end}
.contact{background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:12px}
.addr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addr code{font-family:var(--mono);font-size:14px;line-height:20px;background:var(--bg);border:1px solid var(--line);padding:8px 12px;user-select:all;overflow-wrap:anywhere}
.status{min-height:20px}
.reassure{display:flex;align-items:center;gap:8px;color:var(--muted)}

footer{padding-block:48px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:flex-start}
.foot nav{display:flex;flex-wrap:wrap;gap:16px}
.foot a{color:var(--muted)}
.foot details{max-width:420px}
.foot summary{cursor:pointer;color:var(--muted)}
.foot details p{margin-top:8px}

/* reveal (B7) */
.reveal-ready .reveal{opacity:0;transform:translateY(32px)}
.reveal-ready .reveal.in{opacity:1;transform:none;transition:opacity 700ms var(--ease),transform 700ms var(--ease)}
@keyframes linkIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

@media (max-width:1024px){
  .hero-grid,.final-box,.sec-head{grid-template-columns:minmax(0,1fr)}
  .hero-grid{gap:48px}
  .benefits,.nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cases{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tl{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:16px}
}
@media (max-width:760px){
  .links,.nav-bar>.btn{display:none}
  .menu-btn{display:inline-flex}
  .nav-bar{width:100%;justify-content:space-between}
  .heading-1{font-size:36px;line-height:40px}
  .heading-2{font-size:30px;line-height:36px}
  .heading-3{font-size:30px;line-height:36px}
  .hero{padding-top:calc(128px + env(safe-area-inset-top,0px));padding-bottom:64px}
  section,.tagline{padding-block:64px}
  .sec-head{margin-bottom:32px}
  .split,.benefits,.steps,.cases,.nums,.creds{grid-template-columns:minmax(0,1fr)}
  .case.wide{grid-column:auto}
  .box,.step{padding:24px}
  .tl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:200ms!important;animation:none!important}
  .reveal-ready .reveal{transform:none}
  .tagline .w{opacity:1}
  .btn:hover,.benefit:hover{transform:none}
}
</style>
</head>
<body>
<main id="conteudo" class="hero grid-bg" style="min-height:100vh;border:0;display:flex;align-items:center">
<div class="wrap" style="display:flex;flex-direction:column;gap:24px">
<p class="eyebrow caption-3">Erro 404</p>
<h1 class="heading-1">Esta página<br>não está na planta.</h1>
<p class="sub title-1">O endereço pode ter mudado ou nunca existiu.</p>
<div><a class="btn btn-primary button-lg" href="/">Voltar para o início</a></div>
</div></main>
</body>
</html>
